{% extends "base.html" %}

{% block title %}Sign up — SocialAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="text-center mb-4">
                <div class="badge bg-primary fs-4 px-3 py-2 mb-3">AI</div>
                <h2 class="text-light">Create your account</h2>
                <p class="text-secondary">Start automating your social media</p>
            </div>
            
            <div class="card bg-dark border-secondary">
                <div class="card-body p-4">
                    
                    <div id="errorBox" class="alert alert-danger d-none"></div>
                    
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-light">Full Name</label>
                            <input type="text" name="full_name" 
                                   class="form-control bg-dark text-light border-secondary" 
                                   placeholder="John Smith" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Email</label>
                            <input type="email" name="email" 
                                   class="form-control bg-dark text-light border-secondary" 
                                   placeholder="you@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Password</label>
                            <input type="password" name="password" 
                                   class="form-control bg-dark text-light border-secondary" 
                                   placeholder="Min. 6 characters" minlength="6" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Role</label>
                            <select name="role" 
                                    class="form-select bg-dark text-light border-secondary">
                                <option value="writer">Writer - creates drafts</option>
                                <option value="manager">Manager - approves posts</option>
                                <option value="admin">Admin - full access</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Create account
                        </button>
                    </form>
                    
                    <p class="text-center text-secondary mt-3 mb-0 small">
                        Already have an account? 
                        <a href="/auth/login-page" class="text-primary">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('d-none');
    
    const formData = new FormData(e.target);
    
    const res = await fetch('/auth/register', {
        method: 'POST',
        body: formData
    });
    
    const data = await res.json();
    
    if (res.ok) {
        window.location.href = '/auth/login-page?registered=true';
    } else {
        errorBox.textContent = data.detail || 'Registration failed';
        errorBox.classList.remove('d-none');
    }
});
</script>
{% endblock %}
