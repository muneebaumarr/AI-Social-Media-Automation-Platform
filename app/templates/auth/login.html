{% extends "base.html" %}

{% block title %}Sign in — SocialAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            
            <div class="text-center mb-4">
                <div class="badge bg-primary fs-4 px-3 py-2 mb-3">AI</div>
                <h2 class="text-light">Welcome back</h2>
                <p class="text-secondary">Sign in to your account</p>
            </div>
            
            <div class="card bg-dark border-secondary">
                <div class="card-body p-4">
                    
                    <div id="successBox" class="alert alert-success d-none">
                        Account created successfully. Please sign in.
                    </div>
                    <div id="errorBox" class="alert alert-danger d-none"></div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-light">Email</label>
                            <input type="email" name="email" 
                                   class="form-control bg-dark text-light border-secondary" 
                                   placeholder="you@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Password</label>
                            <input type="password" name="password" 
                                   class="form-control bg-dark text-light border-secondary" 
                                   placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Sign in
                        </button>
                    </form>
                    
                    <p class="text-center text-secondary mt-3 mb-0 small">
                        No account? 
                        <a href="/auth/register-page" class="text-primary">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// Show success message if redirected from register
if (window.location.search.includes('registered=true')) {
    document.getElementById('successBox').classList.remove('d-none');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('d-none');
    
    const formData = new FormData(e.target);
    
    const res = await fetch('/auth/login', {
        method: 'POST',
        body: formData
    });
    
    const data = await res.json();
    
    if (res.ok) {
        window.location.href = '/dashboard';
    } else {
        errorBox.textContent = data.detail || 'Login failed';
        errorBox.classList.remove('d-none');
    }
});
</script>
{% endblock %}
